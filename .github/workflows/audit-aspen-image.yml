name: Find original Aspen source photograph
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-aspen-image.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect named Aspen with explicit original-sculptor credit
        run: |
          python3 - <<'PY'
          import urllib.request,urllib.robotparser,re
          from html.parser import HTMLParser
          root='https://ellamck.com'
          url=root+'/aspen/'
          agent='RebornaDiscovery/0.1 (+https://reborna.co; editorial source research)'
          robots=urllib.robotparser.RobotFileParser()
          robots.set_url(root+'/robots.txt')
          try:robots.read()
          except Exception as exc:
            print('Robots unreachable',str(exc),flush=True)
            raise SystemExit(0)
          permit=robots.can_fetch(agent,url)
          print('ROBOTS',permit,flush=True)
          if not permit:raise SystemExit(0)
          class Extract(HTMLParser):
            def __init__(self):
              super().__init__();self.img=[];self.meta=[]
            def handle_starttag(self,tag,attrs):
              a=dict(attrs)
              if tag=='img':self.img.append({k:a.get(k) for k in ['src','data-src','alt','srcset'] if a.get(k)})
              if tag=='meta' and (a.get('property','').startswith('og:') or a.get('name')=='twitter:image'):self.meta.append(a)
          with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':agent}),timeout=20) as f:
            source=f.read(1_700_000).decode('utf8','replace')
          p=Extract();p.feed(source)
          print('Dawn credit in page:',bool(re.search('Dawn Donofrio',source,re.I)),flush=True)
          print('META',p.meta[:12],flush=True)
          print('IMAGE',p.img[:18],flush=True)
          PY
