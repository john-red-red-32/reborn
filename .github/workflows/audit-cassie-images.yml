name: Audit Cassie source image coverage
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-cassie-images.yml'
      - 'lib/cassie-wix-images.ts'
      - 'lib/cassie-images.ts'
      - 'lib/real-catalogue.ts'
      - 'components/UnifiedSculptCollection.tsx'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  media:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Check original Wix image responses and artist-identity coverage
        run: |
          python3 - <<'PY'
          import json,re,urllib.request,time,urllib.error
          from pathlib import Path
          source=Path('lib/cassie-wix-images.ts').read_text()
          x=re.search(r'export const cassieNamedVinylImages:Record<[^\n]+ = (\{[\s\S]+\});',source)
          assert x,'Wix source image manifest not found'
          images=json.loads(x.group(1))
          text=Path('lib/cassie-profile.ts').read_text()
          a=re.search(r'export const cassieArchive=\[([\s\S]*?)\] as const',text)
          names=re.findall(r'"([^"]+)"',a.group(1))
          assert len(names)==61,len(names)
          old=Path('lib/cassie-images.ts').read_text()
          legacy=re.findall(r'^  "([^"]+)": \[',old,re.M)
          union=set(images)|set(legacy)
          missing=[n for n in names if n not in union]
          assert len(images)==48,(len(images),'Expected 48 verified Wix kit identities')
          assert len(union.intersection(names))>=59,(len(union.intersection(names)),missing)
          assert set(missing)=={'Romilly','Sienna'},missing
          assert not {'Romily','Sienna Rae'} & set(images),'Unapproved aliases cannot be auto-merged'
          print('PASS archive image coverage:',len(union.intersection(names)),'/',len(names),'sculpts; pending',missing,flush=True)
          for name,photos in sorted(images.items()):
            url=photos[0]['url']
            assert url.startswith('https://static.wixstatic.com/media/'),(name,url)
            assert photos[0]['source']=='https://www.cassielove.co.uk/vinyl-doll-kits'
            req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/125.0 Safari/537.36','Accept':'image/avif,image/webp,image/*,*/*;q=0.8','Range':'bytes=0-1023'})
            try:
              with urllib.request.urlopen(req,timeout=18) as response:
                head=response.read(1024)
                assert response.status in (200,206),(name,response.status)
                assert response.headers.get('Content-Type','').startswith('image/'),(name,response.headers.get('Content-Type'))
                assert len(head)>20,(name,'empty media')
                print('OK image',name,response.status,flush=True)
            except Exception as e:raise RuntimeError(f'Original image unreachable for {name}: {e}') from e
            time.sleep(0.2)
          print('PASS all 48 exact-source Wix images are live and respond as images')
          PY
      - name: Verify published Cassie artist collection and kit detail pages
        run: |
          python3 - <<'PY'
          import urllib.request,time
          o=urllib.request.build_opener()
          o.addheaders=[('User-Agent','Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/125.0 Safari/537.36')]
          urllib.request.install_opener(o)
          def page(path):
            with urllib.request.urlopen('https://reborna.co'+path,timeout=25) as r:
              assert r.status==200,(path,r.status)
              return r.read().decode('utf-8','replace')
          for attempt in range(25):
            artist=page('/artists/cassie-ann-love/')
            historic=page('/kits/ava-cassie-ann-love/')
            named=page('/kits/leo-cassie-ann-love/')
            prior=page('/kits/lennox-cassie-ann-love/')
            if all('static.wixstatic.com/media/' in s for s in (artist,historic,named,prior)) and 'Ava' in historic:
              print('PASS Cassie artist grid and historical/current kit pages serve named source photographs')
              break
            print('Waiting for Cloudflare release',attempt+1,flush=True)
            time.sleep(8)
          else:raise SystemExit('Cassie image manifest not yet visible on live Cloudflare')
          assert 'kit-photo-gallery' in historic,'Historical kit image gallery missing'
          assert 'kit-photo-gallery' in named,'Vinyl kit detail gallery missing'
          assert 'kit-photo-gallery' in prior,'Curated kit gallery missing'
          print('PASS live static Cassie galleries and legacy kit pages')
          PY
