name: Audit live Reborna commerce boundaries
on:
  push:
    branches: [main]
    paths:
      - 'functions/api/commerce/**'
      - 'functions/_reborna-stripe.mjs'
      - '.github/workflows/audit-commerce-live.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Confirm live marketplace remains payment-gated
        run: |
          python3 - <<'PY'
          import json,urllib.request,urllib.error
          root='https://reborna.co'
          def check(path,method='GET',body=None):
              headers={'User-Agent':'Mozilla/5.0 Reborna-audit'}
              if body is not None:headers['Content-Type']='application/json'
              request=urllib.request.Request(root+path,method=method,data=body,headers=headers)
              try:
                  with urllib.request.urlopen(request,timeout=25) as r:return r.status,r.read().decode(errors='replace')
              except urllib.error.HTTPError as e:return e.code,e.read().decode(errors='replace')
          status,text=check('/api/commerce/status')
          assert status==200,(status,text[:120])
          settings=json.loads(text)
          assert settings.get('checkoutLive') is False
          assert settings.get('sellerOnboardingAvailable') is False
          for path in ['/api/commerce/me','/api/commerce/orders']:
              status,text=check(path)
              assert status==401,(path,status,text[:100])
          status,text=check('/api/commerce/webhook','POST',b'{}')
          assert status==400,(status,text[:100])
          status,text=check('/marketplace/')
          assert status==200,(status,text[:100])
          print('PASS live marketplace, payment gates, auth and invalid webhook rejection; no charges')
          PY
