name: Audit live Reborna contact
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-contact-live.yml'
      - 'app/contact/**'
      - 'components/ContactForm.tsx'
      - 'components/SiteFooter.tsx'
      - 'functions/api/contact.js'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contact:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Verify deployed contact page, global footer and protected endpoint
        run: |
          python3 - <<'PY'
          import json,time,urllib.request,urllib.error
          base='https://reborna.co'
          def read(path,method='GET',payload=None):
            headers={'User-Agent':'Mozilla/5.0 (Reborna contact audit)','Accept':'text/html,application/json'}
            if payload is not None:
              headers['Content-Type']='application/json'
            req=urllib.request.Request(base+path,method=method,headers=headers,data=None if payload is None else json.dumps(payload).encode())
            try:
              with urllib.request.urlopen(req,timeout=18) as response:
                return response.status,response.read().decode(errors='replace')
            except urllib.error.HTTPError as e:
              return e.code,e.read().decode(errors='replace')
          for attempt in range(8):
            errors=[]
            try:
              status,home=read('/')
              if status!=200 or 'href="/contact/"' not in home: errors.append(('home footer',status))
              status,contact=read('/contact/')
              if status!=200 or 'drop us a little note' not in contact.lower() or 'get in touch' not in contact.lower(): errors.append(('contact page',status))
              status,api=read('/api/contact')
              if status!=405 or 'Method not allowed' not in api: errors.append(('contact endpoint',status))
              status,community=read('/api/community/status')
              info=json.loads(community)
              if status!=200 or not info.get('turnstileSiteKey'): errors.append(('turnstile readiness',status))
            except Exception as e: errors.append(('exception',str(e)[:140]))
            if not errors:
              print('PASS: contact page, global footer, protected Cloudflare Function and Turnstile readiness')
              break
            print('Awaiting Cloudflare deployment',attempt+1,errors,flush=True)
            time.sleep(4)
          else: raise SystemExit('Contact production audit failed: '+repr(errors))
          PY
