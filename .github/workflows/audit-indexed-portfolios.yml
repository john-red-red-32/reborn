name: Audit seven source-only sculptor portfolios
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-indexed-portfolios.yml'
      - 'lib/indexed-original-kits.ts'
      - 'lib/indexed-original-artists.ts'
      - 'lib/indexed-kits-*.ts'
      - 'lib/real-catalogue.ts'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - name: Validate all 39 names and seven live artist profiles
        run: |
          python3 - <<'PY'
          import json,re,time,urllib.request
          paths=['lib/indexed-kits-dawn-laura.ts','lib/indexed-kits-sabine.ts','lib/indexed-kits-gudrun.ts',
                 'lib/indexed-kits-philomena.ts','lib/indexed-kits-alejandra.ts','lib/indexed-kits-severine.ts']
          expected=[15,3,10,5,1,5]
          allkits=[]
          for path,n in zip(paths,expected):
            src=open(path,encoding='utf8').read()
            m=re.search(r'export const \w+:VerifiedKit\[\]=([\s\S]*?);\s*$',src)
            assert m,(path,'parse failure')
            kits=json.loads(m.group(1))
            assert len(kits)==n,(path,len(kits),n)
            allkits.extend(kits)
          a=open('lib/indexed-original-artists.ts',encoding='utf8').read()
          m=re.search(r'export const indexedOriginalArtists:VerifiedArtist\[\]=([\s\S]*?);\s*$',a)
          assert m
          artists=json.loads(m.group(1))
          assert len(artists)==7
          assert len(allkits)==39
          assert len(set(k['slug'] for k in allkits))==39
          assert {k['artistSlug'] for k in allkits}=={a['slug'] for a in artists}
          assert all(len(k.get('photos',[]))==0 for k in allkits)
          assert all(k['sources'][0]['kind']=='artist' for k in allkits)
          elena=[k for k in allkits if k['name']=='Elena'][0]
          assert 'material' not in elena,'Elena material must remain unknown'
          print('PASS 39 official-source kit identities; no fake photo or stock claims',flush=True)
          root='https://reborna.co'
          header={'User-Agent':'Mozilla/5.0 (compatible; RebornaPreviewAudit/1.0)','Accept':'text/html'}
          checks=[('/artists/'+a['slug']+'/',a['name']) for a in artists]
          checks.extend(('/kits/'+k['slug']+'/',k['name']) for k in allkits)
          for attempt in range(45):
            errors=[]
            for path,name in checks:
              try:
                with urllib.request.urlopen(urllib.request.Request(root+path,headers=header),timeout=16) as res:
                  html=res.read(1_500_000).decode('utf8','replace')
                  if res.status!=200 or name not in html:
                    raise AssertionError('missing title')
                  if path.startswith('/kits/') and 'ORIGINAL SCULPT KIT' not in html:
                    raise AssertionError('missing kit detail')
              except Exception as exc:
                errors.append((path,str(exc)[:100]))
            if not errors:
              print('PASS',len(checks),'published artist/kit routes (7+39)',flush=True)
              break
            print('Awaiting Pages production:',attempt+1,errors[:3],flush=True)
            time.sleep(9)
          else:
            raise SystemExit('Some published artist/kit routes not deployed')
          print('No external robots-restricted domains queried during audit.')
          PY
