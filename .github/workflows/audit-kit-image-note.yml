name: Audit finished reborn example note
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-kit-image-note.yml'
      - 'app/kits/[slug]/page.tsx'
      - 'components/KitPhotoGallery.tsx'
      - 'app/globals.css'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  production:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify single kit-wide note and credited photo sources in production
        run: |
          python3 - <<'PY'
          import re,time,urllib.request
          root='https://reborna.co'
          slugs=['brielle-bobby-asleep-maissa-said','mabel-nikki-johnston','emerson-dawn-donofrio']
          headers={'User-Agent':'Mozilla/5.0 (compatible; RebornaEditorialAudit/1.0)','Accept':'text/html'}
          required='Photographs may show reborn dolls completed by artists to illustrate this sculpt'
          for attempt in range(45):
              errors=[]
              for slug in slugs:
                  url=f'{root}/kits/{slug}/'
                  try:
                      with urllib.request.urlopen(urllib.request.Request(url,headers=headers),timeout=18) as resp:
                          assert resp.status==200,(slug,resp.status)
                          html=resp.read(1_500_000).decode('utf8','replace')
                      # Avoid duplicate text in Next.js script hydration payloads.
                      body=re.sub(r'<script\b[^>]*>[\s\S]*?</script>','',html,flags=re.I)
                      assert len(re.findall('class="kit-finished-example-note"',body))==1,(slug,'expected one note')
                      assert body.count(required)==1,(slug,'note missing or repeated')
                      assert 'without rooted hair' in body,(slug,'material explanation absent')
                      assert 'Images may show finished prototype interpretations; the listing concerns the original blank sculpt kit.' not in body,(slug,'obsolete gallery disclaimer')
                      if slug!='emerson-dawn-donofrio':
                          assert 'kit-photo-provenance' in body,(slug,'photo source credit absent')
                      else:
                          assert 'View original sculpt source' in body,(slug,'missing image fallback source')
                  except Exception as exc:
                      errors.append((slug,str(exc)[:120]))
              if not errors:
                  print('PASS one shared finished-reborn explanation per kit page',flush=True)
                  print('PASS source credits remain with photographs, and source-only kits link to original evidence',flush=True)
                  break
              print('Waiting for current Cloudflare deployment',attempt+1,errors,flush=True)
              time.sleep(7)
          else:
              raise SystemExit('Production still has old/repeated photo disclaimers')
          PY
