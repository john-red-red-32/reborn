name: Validate material source-family taxonomy
on:
  push:
    branches: [main]
    paths:
      - 'lib/material-product-families.ts'
      - 'lib/material-routing.ts'
      - 'components/MaterialProductViewer.tsx'
      - '.github/workflows/audit-material-families.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  taxonomy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify source-exact family records and non-confused product options
        run: |
          python3 - <<'PY'
          import json,re
          from pathlib import Path
          s=Path('lib/material-product-families.ts').read_text()
          d=json.loads(s.split('export const materialFamilies:Record<string,FamilyProduct[]>=')[1].strip().rstrip(';'))
          assert len(d)==14
          assert len(d['kebelka-heat-paints'])==46
          assert len(d['gemini-heat-set'])>=70
          assert len(d['hp-babylocks'])==3
          assert sum(len(products) for products in d.values())>=240
          assert sum(len(product.get('variants',[])) for products in d.values() for product in products)>=220
          for family,products in d.items():
            assert len({p['sourceUrl'] for p in products})==len(products),family
            for p in products:
              assert p['title'] and p['sourceUrl'].startswith('https://') and p['photoUrls']
              assert all(v['options'] and v['label'] for v in p.get('variants',[]))
          v=Path('components/MaterialProductViewer.tsx').read_text()
          assert 'rbrn-material-picker-popover' in v
          assert 'rbrn-material-family-section' not in v
          assert 'scrollIntoView' in v
          assert 'materialProductPages' in Path('lib/material-routing.ts').read_text()
          assert Path('app/materials/[slug]/[product]/page.tsx').exists()
          print('PASS: separate product types, 14 original families, exact 220+ variants, compact picker')
          PY