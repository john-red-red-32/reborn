name: Audit materials photography and live product routes
on:
  push:
    branches: [main]
    paths:
      - 'lib/material-product-families.ts'
      - 'lib/material-routing.ts'
      - '.github/workflows/audit-material-product-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  products:
    runs-on: ubuntu-latest
    timeout-minutes: 11
    steps:
      - uses: actions/checkout@v4
      - name: Check source product photo records
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('lib/material-product-families.ts').read_text().split('export const materialFamilies:Record<string,FamilyProduct[]>=')[1].strip().rstrip(';'))
          assert len(d)==14
          for key,products in d.items():
            assert products,key
            for p in products:
              assert p['photoUrls'] and all(x.startswith('https://') for x in p['photoUrls'])
              assert p['sourceUrl'].startswith('https://')
          print('PASS 14 source-identified product families and gallery references')
          PY
      - name: Confirm catalogue range and individual product URLs on production
        run: |
          python3 - <<'PY'
          import json,re,time,urllib.request
          from pathlib import Path
          d=json.loads(Path('lib/material-product-families.ts').read_text().split('export const materialFamilies:Record<string,FamilyProduct[]>=')[1].strip().rstrip(';'))
          urls=['/materials/']
          for group,products in d.items():
            urls.append('/materials/'+group+'/')
            first=products[0]['sourceUrl'].split('?')[0].rstrip('/').split('/')[-1]
            slug=re.sub(r'[^a-z0-9]+','-',first.lower()).strip('-')
            urls.append('/materials/'+group+'/'+slug+'/')
          for attempt in range(31):
            errors=[]
            for route in urls:
              try:
                req=urllib.request.Request('https://reborna.co'+route,headers={'User-Agent':'Mozilla/5.0'})
                with urllib.request.urlopen(req,timeout=16) as response:
                  html=response.read(2000000).decode('utf8','replace')
                  assert response.status==200
                if route=='/materials/':
                  assert 'Browse products' in html
                elif route.count('/')==3:
                  assert 'rbrn-range-card' in html
                else:
                  assert 'View at original supplier' in html and 'rbrn-material-main-image' in html
              except Exception as e:errors.append((route,str(e)[:100]))
            if not errors:
              print('PASS: 14 distinct catalogues and 14 individual product pages live, with source galleries',flush=True)
              break
            print('Production pending',attempt+1,errors[:5],flush=True)
            time.sleep(7)
          else:raise SystemExit(str(errors[:15]))
          PY