name: Audit Nikki kit imagery
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-nikki-images.yml'
      - 'lib/nikki-shopify-catalogue.ts'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  imagery:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - name: Validate all 15 Shopify image galleries and source responses
        run: |
          python3 - <<'PY'
          import json,re,urllib.request,urllib.error,time
          from pathlib import Path
          text=Path('lib/nikki-shopify-catalogue.ts').read_text()
          m=re.search(r'export const nikkiKits:VerifiedKit\[\]=(\[[\s\S]*?\]);\s*export const nikkiRetailOffers',text)
          assert m,'Nikki catalogue JSON not found'
          kits=json.loads(m.group(1))
          assert len(kits)==15, f'Expected 15 original kits, got {len(kits)}'
          full=set()
          for k in kits:
            ps=k.get('photos',[])
            assert len(ps)>=6,(k['name'],'Missing gallery')
            assert all(im['source'].startswith('https://nikkisseasidebabies.co.uk/products/') for im in ps)
            assert all(im['url'].startswith('https://cdn.shopify.com/s/files/1/0276/0851/4612/') for im in ps)
            assert all(im['credit'] for im in ps)
            full.add(k['slug'])
          assert len(full)==15
          for k in kits:
            url=k['photos'][0]['url']
            request=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 (compatible; Reborna-media-audit/1.0)','Accept':'image/avif,image/webp,image/*,*/*;q=0.8','Range':'bytes=0-2047'})
            try:
              with urllib.request.urlopen(request,timeout=20) as r:
                data=r.read(2048)
                assert r.status in (200,206),(k['name'],r.status)
                assert r.headers.get('Content-Type','').startswith('image/'),(k['name'],r.headers.get('Content-Type'))
                assert len(data)>=16,(k['name'],'Empty image')
                print(f"OK {k['name']} - {r.status} {r.headers.get('Content-Type')} ({len(k['photos'])} source images)")
            except Exception as e:raise RuntimeError(f"Source image failed for {k['name']}: {url}: {e}") from e
            time.sleep(0.25)
          print('PASS: all 15 original kit images reachable; galleries contain',sum(len(k['photos']) for k in kits),'photos')
          PY

      - name: Confirm live Reborna pages display Shopify photos and researched biography
        run: |
          python3 - <<'PY'
          import json,re,time,urllib.request,html
          from pathlib import Path
          from html.parser import HTMLParser
          class Photos(HTMLParser):
            def __init__(self):
              super().__init__();self.sources=[]
            def handle_starttag(self,tag,attrs):
              if tag=="img":self.sources.append(dict(attrs).get("src",""))
          text=Path('lib/nikki-shopify-catalogue.ts').read_text()
          m=re.search(r'export const nikkiKits:VerifiedKit\[\]=(\[[\s\S]*?\]);\s*export const nikkiRetailOffers',text)
          kits=json.loads(m.group(1))
          root="https://reborna.co"
          opener=urllib.request.build_opener()
          opener.addheaders=[("User-Agent","Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/125.0 Safari/537.36")]
          def get(path):
            with opener.open(root+path,timeout=25) as r:
              body=r.read().decode("utf-8","replace")
              assert r.status==200,(path,r.status)
              return body
          for attempt in range(24):
            bio=get("/artists/nikki-johnston/")
            if "Princess Charlotte" in bio and "MacPherson Arts" in bio and "FEATURED" not in bio.upper()[:0]:
              break
            print("Awaiting updated Cloudflare biography",attempt+1,flush=True)
            time.sleep(8)
          else:raise SystemExit("Latest Nikki biography has not reached reborna.co")
          assert "not a portrait" in bio.lower(),"Artist artwork must not be labelled a portrait"
          assert "Nikki’s Seaside Babies" in bio or "Nikki&#x27;s Seaside Babies" in bio
          assert "MacPherson" in bio
          directory=get("/artists/")
          assert "cdn.shopify.com/s/files/1/0276/0851/4612/" in directory,"Nikki's directory artwork is absent"
          for k in kits:
            body=get("/kits/"+k["slug"]+"/")
            p=Photos();p.feed(body)
            expected=k["photos"][0]["url"]
            assert any(expected==html.unescape(img) for img in p.sources),(k["name"],"primary image missing from published kit page",p.sources[:3])
            assert "kit-photo-gallery" in body,(k["name"],"gallery missing")
            print("LIVE OK",k["slug"],"image tags",len(p.sources),flush=True)
          collection=get("/artists/nikki-johnston/")
          p=Photos();p.feed(collection)
          assert len([v for v in p.sources if "cdn.shopify.com/s/files/1/0276/0851/4612/" in v])>=15,"Artist collection has missing cards"
          print("PASS: live 15 galleries, artist directory, collection and independently sourced Nikki biography")
          PY
