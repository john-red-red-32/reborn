name: Audit photo-pending sculptor profiles
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-photo-pending-profiles.yml'
      - 'components/KitPhotoGallery.tsx'
      - 'app/artists/[slug]/page.tsx'
      - 'app/kits/[slug]/page.tsx'
      - 'app/globals.css'
      - 'lib/indexed-original-stories.ts'
      - 'lib/retailer-provenance-artists.ts'
      - 'lib/real-catalogue.ts'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  production:
    runs-on: ubuntu-latest
    timeout-minutes: 11
    steps:
      - name: Confirm artist and kit source links remain useful without photo rights
        run: |
          python3 - <<'PY'
          import time,urllib.request
          root='https://reborna.co'
          groups={
            'dawn-donofrio':False,'laura-tuzio-ross':False,
            'philomena-donnelly':False,'sabine-altenkirch-junkes':False,
            'gudrun-legler':False,'alejandra-de-zuniga':False,
            'severine-piret':False,'elly-knoops':True,
            'iveta-eckertova':True,'olga-auer':True,
            'sabrina-hergarten':True,'ping-lau':False,
            'laura-lee-eagles':False,'joanna-kazmierczak':True
          }
          photographed_artists={
            'dawn-donofrio','laura-tuzio-ross','philomena-donnelly',
            'sabine-altenkirch-junkes','gudrun-legler',
            'elly-knoops','iveta-eckertova','olga-auer',
            'alejandra-de-zuniga','severine-piret',
            'sabrina-hergarten','laura-lee-eagles','ping-lau',
            'joanna-kazmierczak'
          }
          photo_pending_kits={'josie-ping-lau'}
          source_photographed_kits={'teddy-philomena-donnelly','sam-gudrun-legler','elena-alejandra-de-zuniga','emerson-dawn-donofrio','emma-dawn-donofrio','willow-joanna-kazmierczak'}
          kits=sorted(photo_pending_kits|source_photographed_kits)
          h={'User-Agent':'Mozilla/5.0 (compatible; RebornaSourceAudit/1.0)','Accept':'text/html'}
          for attempt in range(28):
            failed=[]
            for slug,retailer in groups.items():
              path='/artists/'+slug+'/'
              try:
                with urllib.request.urlopen(urllib.request.Request(root+path,headers=h),timeout=17) as r:
                  html=r.read(1_600_000).decode('utf-8','replace')
                assert (('ORIGINAL ARTWORK PENDING' not in html) if slug in photographed_artists else ('ORIGINAL ARTWORK PENDING' in html)),f'{path}: artist artwork state unexpected'
                assert (('Specialist retailer reference' in html) if retailer else ('Official sculptor website' in html)),f'{path}: source relationship label does not match'
                if slug=='dawn-donofrio':
                  assert 'Original silicone sculpture for artists to finish' in html,f'{path}: editorial heading mismatch'
              except Exception as e:failed.append((path,str(e)[:95]))
            for slug in kits:
              path='/kits/'+slug+'/'
              try:
                with urllib.request.urlopen(urllib.request.Request(root+path,headers=h),timeout=17) as r:
                  html=r.read(1_500_000).decode('utf-8','replace')
                if slug in photo_pending_kits:
                  assert 'Photograph awaiting identity and usage-rights review' in html,path
                  assert 'View original sculpt source' in html,path
                else:
                  assert 'kit-main-photo' in html and 'kit-photo-provenance' in html,path
              except Exception as e:failed.append((path,str(e)[:95]))
            if not failed:
              print('PASS all 14 original artist portfolios, their recovered covers and remaining transparent fallbacks',flush=True)
              break
            print('Waiting Cloudflare',attempt+1,len(failed),'failures',failed[:3],flush=True)
            time.sleep(8)
          else:raise SystemExit('Live photo-pending experience has not deployed')
          print('Rights-restricted or uncertain photos remain unpublished. No image source was invented.')
          PY
