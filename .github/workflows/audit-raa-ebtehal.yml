name: Audit RAA verified photographed sculptors
on:
  push:
    branches: [main]
    paths: ['.github/workflows/audit-raa-ebtehal.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Verify live photographic artist and original kit pages
        run: |
          python3 - <<'PY'
          import urllib.request,time,html
          pages={
            '/artists/ebtehal-abul/':['Ebtehal Abul','artist-feature-image','Original sculpt collection'],
            '/kits/coco-ebtehal-abul/':['Coco','kit-main-photo','kit-photo-provenance','irresistables.com'],
            '/kits/sara-ebtehal-abul/':['Sara','kit-main-photo','kit-photo-provenance','latiendadelbebereborn.com'],
            '/artists/eva-brilli/':['Eva Brilli','artist-feature-image'],
            '/kits/gabriel-eva-brilli/':['Gabriel','kit-main-photo','kit-photo-provenance','irresistables.com'],
            '/artists/nadine-dolotova/':['Nadine Dolotova','artist-feature-image'],
            '/kits/rachele-eva-brilli/':['Rachele','kit-main-photo','kit-photo-provenance'],
            '/kits/florence-eva-brilli/':['Florence','kit-main-photo','kit-photo-provenance'],
            '/kits/sama-ebtehal-abul/':['Sama','kit-main-photo','kit-photo-provenance'],
            '/kits/sila-ebtehal-abul/':['Sila','kit-main-photo','kit-photo-provenance'],
            '/kits/arisha-nadine-dolotova/':['Arisha','kit-main-photo','kit-photo-provenance'],
            '/kits/ozzy-nadine-dolotova/':['Ozzy','kit-main-photo','kit-photo-provenance'],
            '/kits/tarni-nadine-dolotova/':['Tarni','kit-main-photo','kit-photo-provenance']
          }
          for n in range(30):
            failed=[]
            for path,needles in pages.items():
              try:
                request=urllib.request.Request('https://reborna.co'+path,headers={'User-Agent':'Mozilla/5.0'})
                with urllib.request.urlopen(request,timeout=15) as r:
                  body=html.unescape(r.read(1200000).decode('utf-8','replace'))
                  assert r.status==200,path
                assert all(term in body for term in needles), (path,[x for x in needles if x not in body])
              except Exception as e:failed.append((path,str(e)[:140]))
            if not failed:
              print('PASS three RAA artist portfolios and ten photographed original sculpt kit pages on live Cloudflare production')
              break
            print('Waiting for Cloudflare',n+1,failed,flush=True)
            time.sleep(8)
          else:raise SystemExit('RAA sculptor cohort not yet verified in production')
          PY
