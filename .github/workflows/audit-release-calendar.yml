name: Verify Discover feed and calendar
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-release-calendar.yml'
      - 'app/page.tsx'
      - 'app/calendar/**'
      - 'components/DiscoverFeed.tsx'
      - 'components/HomeReleaseCalendar.tsx'
      - 'components/ReleaseCalendarPage.tsx'
      - 'components/SiteHeader.tsx'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Check live Discover page and separate static release calendar
        run: |
          python3 - <<'PY'
          import re,time,urllib.request
          from pathlib import Path
          opener=urllib.request.build_opener()
          opener.addheaders=[("User-Agent","Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/125.0 Safari/537.36"),("Accept","text/html,*/*;q=0.8")]
          urllib.request.install_opener(opener)
          def page(path):
            with opener.open("https://reborna.co"+path,timeout=20) as response:
              assert response.status==200,(path,response.status)
              return response.read().decode("utf-8","replace")
          last=""
          for attempt in range(18):
            try:
              home=page("/")
              calendar=page("/calendar/")
              artist=page("/artists/nikki-johnston/")
              verify=page("/verify/")
              assert 'href="/calendar/"' in home,"Homepage must link to dedicated calendar"
              assert 'id="release-calendar"' not in home,"Old homepage calendar should be gone"
              assert 'id="catalogue"' in home,"Discover feed anchor missing"
              assert 'discover-feed-grid' in home,"Genuine product feed missing"
              assert 'Mabel' in home and 'Christopher' in home,"Real sourced kit cards missing"
              assert 'Design preview: the artists' not in home,"Demo kits should not be in Discover"
              assert 'href="/calendar/"' in calendar or 'release-calendar' in calendar
              assert 'id="release-calendar"' in calendar,"Calendar is not static HTML"
              section=calendar[calendar.index('id="release-calendar"'):]
              assert section.index('home-calendar-year-title">2027')<section.index('home-calendar-year-title">2026'),"Year sorting invalid"
              assert section.index(">January</h4>")<section.index(">November</h4>")<section.index(">October</h4>"),"Months not descending"
              assert section.count('class="home-calendar-card"')>=4,"Original example entries missing"
              assert 'Release archive' not in section,"Outdated archive wording remains"
              assert 'timeline backwards' not in section,"Unnecessary backwards terminology remains"
              assert '<summary>More dates</summary>' in section,"Secondary date not preserved as optional detail"
              assert 'Final balance' in section and 'Total' in section,"Deposit/balance/total fields missing"
              assert 'Design preview:' in section,"Fictional dates must remain labelled"
              assert 'Original art deserves to be protected.' in artist
              assert 'How to verify a kit' in verify
              print("PASS: new Discover feed, static separate calendar, release data and authenticity guidance")
              break
            except Exception as e:
              last=str(e)
              print("Waiting on deployment",attempt+1,last,flush=True)
              time.sleep(7)
          else:raise SystemExit("Live migration smoke test failed: "+last)
          css=Path('app/globals.css').read_text()
          assert 'content-visibility:auto' in css,"Deferred rendering style missing"
          code=Path('components/DiscoverFeed.tsx').read_text()
          assert 'IntersectionObserver' in code and 'BATCH_SIZE=12' in code,"Progressive batches not configured"
          assert 'verifiedKits' in code and 'sortRank' in code,"Discover must use genuine kit records and availability"
          assert Path('lib/demo-data.ts').exists(),"Example calendar source data must be preserved"
          print("PASS: progressive discovery and unchanged demo source data")
          PY
