name: Discover artist site
on:
  push:
    branches: [main]
    paths:
      - 'scripts/discover_artist_site.py'
      - 'scripts/extract_sculpt_candidates.py'
      - 'scripts/extract_wix_galleries.py'
      - 'scripts/reconcile_wix_archive.py'
      - 'scripts/build_cassie_image_evidence.py'
      - 'scripts/match_artist_catalogue.py'
      - 'scripts/test_match_artist_catalogue.py'
      - 'config/artist-sources/**'
      - 'scripts/site_platforms.py'
      - 'scripts/save_discovery_snapshot.py'
      - '.github/workflows/discover-artist.yml'
  workflow_dispatch:
    inputs:
      url:
        description: 'Public HTTPS homepage or sculpt index'
        required: true
        type: string
        default: 'https://www.cassielove.co.uk/'
      max_pages:
        description: 'Maximum HTML pages to visit (1-80)'
        required: true
        default: '30'
        type: string

permissions:
  contents: write

concurrency:
  group: artist-discovery-${{ github.ref }}
  cancel-in-progress: false

jobs:
  discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Validate matching rules and Python syntax
        run: |
          python3 -m unittest discover -s scripts -p 'test_match_artist_catalogue.py' -v
          python3 -m compileall -q scripts
      - name: Crawl source pages without modifying live catalogue
        env:
          SOURCE_URL: ${{ inputs.url || 'https://www.cassielove.co.uk/' }}
          MAX_PAGES: ${{ inputs.max_pages || '30' }}
        run: |
          python3 scripts/discover_artist_site.py \
            --url "$SOURCE_URL" \
            --max-pages "$MAX_PAGES" \
            --delay 1.5 \
            --out artifacts/source-discovery.json
      - name: Generate source-attributed sculpt candidates
        run: |
          python3 scripts/extract_sculpt_candidates.py \
            --input artifacts/source-discovery.json \
            --out artifacts/extraction-candidates.json
      - name: Install browser for Wix gallery discovery
        run: |
          python3 -m pip install playwright==1.55.0
          python3 -m playwright install --with-deps chromium
      - name: Render public Wix gallery pages
        run: |
          python3 scripts/extract_wix_galleries.py \
            --input artifacts/source-discovery.json \
            --out artifacts/wix-gallery-evidence.json
      - name: Reconcile historical kits against editorial archive
        run: |
          python3 scripts/reconcile_wix_archive.py \
            --gallery artifacts/wix-gallery-evidence.json \
            --archive lib/cassie-profile.ts \
            --out artifacts/wix-archive-reconciliation.json
      - name: Safely link source-named Wix kit photo evidence
        run: |
          python3 scripts/build_cassie_image_evidence.py \
            --gallery artifacts/wix-gallery-evidence.json \
            --archive lib/cassie-profile.ts \
            --out artifacts/cassie-source-images.json
      - name: Reconcile artist-scoped kit identities
        run: |
          python3 scripts/match_artist_catalogue.py \
            --gallery artifacts/wix-gallery-evidence.json \
            --manifest-dir config/artist-sources \
            --out artifacts/artist-identity-matches.json
      - name: Persist successful JSON reports on a separate GitHub branch
        if: success()
        env:
          INPUT_URL: ${{ inputs.url || 'https://www.cassielove.co.uk/' }}
          SOURCE_RUN_ID: ${{ github.run_id }}
        run: |
          python3 scripts/save_discovery_snapshot.py \
            --input-dir artifacts \
            --output-dir /tmp/reborna-discovery-snapshot \
            --url "$INPUT_URL" \
            --run-id "$SOURCE_RUN_ID"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin scrape-results || true
          if git show-ref --verify --quiet refs/remotes/origin/scrape-results; then
            git checkout -B scrape-results origin/scrape-results
          else
            git checkout --orphan scrape-results
            git rm -rf --cached . >/dev/null
          fi
          mkdir -p snapshots
          cp -R /tmp/reborna-discovery-snapshot/. snapshots/
          git add snapshots
          if ! git diff --cached --quiet; then
            git commit -m "Archive discovery scan ${SOURCE_RUN_ID} [skip ci]"
            git push origin HEAD:scrape-results
          fi
      - name: Upload discovery evidence for manual review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: artist-discovery
          path: |
            artifacts/source-discovery.json
            artifacts/extraction-candidates.json
            artifacts/wix-gallery-evidence.json
            artifacts/wix-archive-reconciliation.json
            artifacts/cassie-source-images.json
            artifacts/artist-identity-matches.json
          retention-days: 30
          if-no-files-found: warn
