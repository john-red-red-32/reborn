name: Discover Sandy Faber gallery
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/discover-sandy-gallery.yml'
      - 'config/artist-sources/sandy-faber.json'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Crawl original sculptor vinyl and silicone gallery links
        run: |
          python3 scripts/discover_artist_site.py \
            --url https://www.sandysbabies.com/vinyl-kits/ --max-pages 14 --delay 1.0 \
            --out artifacts/source-discovery.json
      - name: Extract available structured source product evidence
        run: |
          python3 scripts/extract_sculpt_candidates.py --input artifacts/source-discovery.json --out artifacts/extraction-candidates.json
      - name: Print official source names and photo evidence without publication
        run: |
          python3 - <<'PY'
          import json
          d=json.load(open('artifacts/source-discovery.json'))
          for p in d['pages']:
            if '/vinyl-kits/' in p['url'] or '/blank-silicone-kits/' in p['url']:
              print('Page:',p['url'])
              print('Image candidates:',len(p['image_candidates']))
              for i,x in enumerate(p['image_candidates'][:38]):
                print('PHOTO',i,'alt=',repr(x['alt'][:80]),'url=',x['url'][:160])
          print('Pages',d['pages_succeeded'],'platform evidence:',d['platforms'],'crawl errors:',d['errors'][:5])
          PY
      - name: Save review evidence to scrape-results
        env:
          SOURCE_URL: https://www.sandysbabies.com/vinyl-kits/
          SOURCE_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          python3 scripts/save_discovery_snapshot.py --input-dir artifacts --output-dir /tmp/reborna-sandy --url "$SOURCE_URL" --run-id "$SOURCE_RUN_ID"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin scrape-results
          git checkout -B scrape-results origin/scrape-results
          cp -R /tmp/reborna-sandy/. snapshots/
          git add snapshots
          if ! git diff --cached --quiet; then
            git commit -m "Archive Sandy Faber source gallery ${{ github.run_id }} [skip ci]"
            for attempt in 1 2 3 4 5; do
              if git push origin HEAD:scrape-results; then exit 0; fi
              git fetch origin scrape-results
              git rebase origin/scrape-results || { git rebase --abort; exit 1; }
              sleep 2
            done
            exit 1
          fi
      - name: Retain research artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sandy-sculpt-gallery-${{ github.run_id }}
          path: artifacts/*.json
          retention-days: 30
