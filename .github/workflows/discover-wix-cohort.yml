name: Discover Bonnie and Doris Wix sources
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/discover-wix-cohort.yml'
      - 'scripts/extract_wix_named_images.py'
      - 'scripts/test_wix_named_images.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: discover-wix-sculptors
  cancel-in-progress: false
jobs:
  discover:
    name: Wix audit ${{ matrix.artist }}
    runs-on: ubuntu-latest
    timeout-minutes: 16
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - artist: bonnie-brown
            url: https://www.bonniebrowndolls.com/doll-kits
          - artist: doris-moyers-hornbogen
            url: https://www.dmhsculptures.com/vinyl-kits
    steps:
      - uses: actions/checkout@v4
      - name: Validate discovery scripts
        run: |
          python3 -m unittest discover -s scripts -p 'test_wix_named_images.py' -v
          python3 -m unittest discover -s scripts -p 'test_match_artist_catalogue.py' -v
          python3 -m compileall -q scripts
      - name: Explore robots-permitted original artist site pages
        run: |
          python3 scripts/discover_artist_site.py \
            --url "${{ matrix.url }}" --max-pages 18 --delay 1.0 \
            --out artifacts/source-discovery.json
      - name: Extract explicit product schema as research evidence
        run: |
          python3 scripts/extract_sculpt_candidates.py \
            --input artifacts/source-discovery.json --out artifacts/extraction-candidates.json
      - name: Extract original images from explicitly named Wix kit pages
        run: |
          if [ "${{ matrix.artist }}" = "bonnie-brown" ]; then
            python3 scripts/extract_wix_named_images.py \
              --input artifacts/source-discovery.json \
              --collection /doll-kits:vinyl \
              --out artifacts/wix-named-image-evidence.json
          else
            python3 scripts/extract_wix_named_images.py \
              --input artifacts/source-discovery.json \
              --collection /vinyl-kits:vinyl \
              --out artifacts/wix-named-image-evidence.json
          fi
      - name: Verify Wix Stores product pages and source-matched photographs
        run: |
          python3 -m unittest discover -s scripts -p 'test_wix_store_products.py' -v
          if [ "${{ matrix.artist }}" = "doris-moyers-hornbogen" ]; then
            python3 scripts/extract_wix_store_products.py \
              --input artifacts/source-discovery.json \
              --collection /vinyl-kits:vinyl \
              --max-products 40 --delay 1.0 \
              --out artifacts/wix-store-products.json
          else
            python3 scripts/extract_wix_store_products.py \
              --input artifacts/source-discovery.json \
              --collection /doll-kits:vinyl \
              --max-products 10 --delay 1.0 \
              --out artifacts/wix-store-products.json
          fi
      - name: Prepare browser for artist-owned Wix galleries
        run: |
          python3 -m pip install playwright==1.55.0
          python3 -m playwright install --with-deps chromium
      - name: Inspect any documented named Wix galleries
        run: |
          python3 scripts/extract_wix_galleries.py \
            --input artifacts/source-discovery.json --out artifacts/wix-gallery-evidence.json
      - name: Reconcile named gallery designs only with matching artist
        run: |
          python3 scripts/match_artist_catalogue.py \
            --gallery artifacts/wix-gallery-evidence.json \
            --manifest config/artist-sources/${{ matrix.artist }}.json \
            --out artifacts/artist-identity-matches.json
      - name: Print coverage and uncertainty for editorial review
        run: |
          python3 - <<'PY'
          import json
          a=json.load(open('artifacts/source-discovery.json'))
          b=json.load(open('artifacts/extraction-candidates.json'))
          c=json.load(open('artifacts/wix-gallery-evidence.json'))
          n=json.load(open('artifacts/wix-named-image-evidence.json'))
          s=json.load(open('artifacts/wix-store-products.json'))
          print('Wix source:',a['source'])
          print('Pages scanned:',a['pages_succeeded'],'errors:',a['errors'][:5])
          print('Detected platforms:',a['platforms'])
          print('Structured product candidates:',b['candidate_count'])
          print('Named Wix cards:',c['kit_cards_found'])
          print('Named artist-page source images:',n['kit_cards_found'])
          print('Wix store products parsed:',s['products_parsed'],'photo-matched:',s['source_photo_matched'],'errors:',s['errors'][:4])
          print('Other photos held for review:',c['unverified_gallery_photos_found'])
          print('Research only. No catalogue or images published.')
          PY
      - name: Save public-source evidence to separate scrape-results branch
        if: success()
        env:
          SOURCE_URL: ${{ matrix.url }}
          SOURCE_RUN_ID: ${{ github.run_id }}
        run: |
          python3 scripts/save_discovery_snapshot.py \
            --input-dir artifacts --output-dir /tmp/reborna-wix-cohort \
            --url "$SOURCE_URL" --run-id "$SOURCE_RUN_ID"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin scrape-results
          git checkout -B scrape-results origin/scrape-results
          mkdir -p snapshots
          cp -R /tmp/reborna-wix-cohort/. snapshots/
          git add snapshots
          if ! git diff --cached --quiet; then
            git commit -m "Archive Wix sculptor scan ${{ matrix.artist }} ${{ github.run_id }} [skip ci]"
            # Other scanners also write independent host snapshots here.
            # Retry safely with rebase rather than force-pushing their work.
            for attempt in 1 2 3 4 5 6; do
              if git push origin HEAD:scrape-results; then
                echo "PASS evidence archived without overwriting concurrent writers"
                exit 0
              fi
              echo "Concurrent scrape-results update; rebasing attempt $attempt"
              git fetch origin scrape-results
              git rebase origin/scrape-results || { git rebase --abort; exit 1; }
              sleep 2
            done
            echo "Could not safely persist after retries" >&2
            exit 1
          fi
      - name: Preserve downloadable source diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wix-${{ matrix.artist }}-${{ github.run_id }}
          path: artifacts/*.json
          retention-days: 30
          if-no-files-found: warn
