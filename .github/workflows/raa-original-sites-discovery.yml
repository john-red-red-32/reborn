name: RAA artist original-website source-adapter discovery
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/raa-original-sites-discovery.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  site:
    runs-on: ubuntu-latest
    timeout-minutes: 11
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - artist: jodie-lombardo
            platform: unknown
            site: https://www.mysweetlittleangels.com.au/
          - artist: manuela-bertocchi
            platform: wix
            site: https://manuelabertocchi.wixsite.com/piccolitesori
          - artist: le-ruban-rose
            platform: wix
            site: https://rutagui.wixsite.com/lerubanrose?lang=es
          - artist: loves-lovable-babies
            platform: wix
            site: https://loveslovablebabies.wixsite.com/loves-lovable-babies
          - artist: nadine-dolotova
            platform: shopify
            site: https://reborn-silicone-dolls-by-nadine.myshopify.com/collections/blank-silicone-kits
    steps:
      - uses: actions/checkout@v4
      - name: Discover original public site, robots-compliant, platform-aware
        env:
          ARTIST: ${{ matrix.artist }}
          SITE: ${{ matrix.site }}
        run: |
          mkdir -p artifacts
          if python3 scripts/discover_artist_site.py --url "$SITE" --max-pages 12 --delay 1 --out "artifacts/$ARTIST-site.json"; then
            python3 scripts/extract_sculpt_candidates.py --input "artifacts/$ARTIST-site.json" --out "artifacts/$ARTIST-sculpt-candidates.json"
          else
            printf '{"artist":"%s","source":"%s","review_state":"source_not_scrapable","warning":"No product/gallery evidence assumed."}' "$ARTIST" "$SITE" > "artifacts/$ARTIST-site.json"
          fi
      - name: Archive source snapshots without publishing unreviewed sculpts
        env:
          ARTIST: ${{ matrix.artist }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/raa-site
          cp artifacts/"$ARTIST"-*.json /tmp/raa-site/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin scrape-results
          git checkout -B scrape-results origin/scrape-results
          mkdir -p "snapshots/raa/source-sites/$ARTIST"
          cp /tmp/raa-site/*.json "snapshots/raa/source-sites/$ARTIST/"
          git add "snapshots/raa/source-sites/$ARTIST"
          if ! git diff --cached --quiet; then
            git commit -m "Research RAA artist site $ARTIST $RUN_ID [skip ci]"
            for n in 1 2 3 4 5 6; do
              if git push origin HEAD:scrape-results; then exit 0; fi
              git fetch origin scrape-results
              git rebase origin/scrape-results || { git rebase --abort; exit 1; }
              sleep 2
            done
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: raa-artist-site-${{ matrix.artist }}
          path: artifacts/*.json
          retention-days: 30
