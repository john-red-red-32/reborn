name: Recover missing original sculpt photos
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/recover-missing-photos.yml'
      - 'scripts/recover_original_source_images.py'
      - 'scripts/test_recover_original_source_images.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  investigate:
    name: Image review ${{ matrix.cohort }}
    runs-on: ubuntu-latest
    timeout-minutes: 14
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - cohort: original-studios
            artists: dawn-donofrio,laura-tuzio-ross,philomena-donnelly
          - cohort: european-studios
            artists: sabine-altenkirch-junkes,gudrun-legler,alejandra-de-zuniga,severine-piret
          - cohort: dealer-archives-1
            artists: elly-knoops,iveta-eckertova,olga-auer,sabrina-hergarten
          - cohort: dealer-archives-2
            artists: ping-lau,laura-lee-eagles
    steps:
      - uses: actions/checkout@v4
      - name: Set up BeautifulSoup
        run: python3 -m pip install beautifulsoup4
      - name: Validate strict exact-name image matching
        run: python3 -m unittest discover -s scripts -p test_recover_original_source_images.py -v
      - name: Inspect source metadata and name-labelled product images
        run: |
          python3 scripts/recover_original_source_images.py \
            --artists "${{ matrix.artists }}" \
            --out "artifacts/image-review-${{ matrix.cohort }}.json"
      - name: Archive image candidates on scrape-results research branch
        env:
          COHORT: ${{ matrix.cohort }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/reborna-photo-research
          cp "artifacts/image-review-$COHORT.json" "/tmp/reborna-photo-research/$COHORT.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin scrape-results
          git checkout -B scrape-results origin/scrape-results
          mkdir -p snapshots/image-review
          cp "/tmp/reborna-photo-research/$COHORT.json" "snapshots/image-review/$COHORT.json"
          git add snapshots/image-review
          if ! git diff --cached --quiet; then
            git commit -m "Archive photo candidate research $COHORT $RUN_ID [skip ci]"
            for n in 1 2 3 4 5 6; do
              if git push origin HEAD:scrape-results; then exit 0; fi
              git fetch origin scrape-results
              git rebase origin/scrape-results || { git rebase --abort; exit 1; }
              sleep 2
            done
            exit 1
          fi
      - name: Preserve evidence for editorial image review, not automatic publication
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: missing-photo-research-${{ matrix.cohort }}-${{ github.run_id }}
          path: artifacts/*.json
          retention-days: 30
          if-no-files-found: warn
