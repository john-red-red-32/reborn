name: Research complete material product families
on:
  push:
    branches: [main]
    paths: ['scripts/research_material_families.py','.github/workflows/research-material-families.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - run: pip -q install beautifulsoup4
      - name: Collect full actual ranges, colour names and exact source images
        run: python3 scripts/research_material_families.py
      - name: Archive non-public editorial verification data
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          cp materials-product-families-20261014.json /tmp/materials-product-families-20261014.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin scrape-results
          git checkout -B scrape-results origin/scrape-results
          mkdir -p snapshots/materials
          cp /tmp/materials-product-families-20261014.json snapshots/materials/product-families-20261014.json
          git add snapshots/materials/product-families-20261014.json
          if ! git diff --cached --quiet; then
            git commit -m "Research original material product families $RUN_ID [skip ci]"
            for n in 1 2 3 4 5; do
              if git push origin HEAD:scrape-results; then exit 0; fi
              git fetch origin scrape-results
              git rebase origin/scrape-results || { git rebase --abort; exit 1; }
              sleep 2
            done
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: material-product-family-evidence
          path: materials-product-families-20261014.json
          retention-days: 45
