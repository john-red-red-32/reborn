name: Research materials images and variants
on:
  push:
    branches: [main]
    paths: ['scripts/research_material_source_images.py','.github/workflows/research-material-source-images.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/research_material_source_images.py
      - name: Preserve exact source evidence in private research branch
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          cp materials-image-research.json /tmp/materials-image-research.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin scrape-results
          git checkout -B scrape-results origin/scrape-results
          mkdir -p snapshots/materials
          cp /tmp/materials-image-research.json snapshots/materials/product-images-variants.json
          git add snapshots/materials/product-images-variants.json
          if ! git diff --cached --quiet; then
            git commit -m "Archive verified source materials evidence $RUN_ID [skip ci]"
            for n in 1 2 3 4 5 6; do
              if git push origin HEAD:scrape-results; then exit 0; fi
              git fetch origin scrape-results
              git rebase origin/scrape-results || { git rebase --abort; exit 1; }
              sleep 2
            done
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: materials-evidence
          path: materials-image-research.json
          retention-days: 30
