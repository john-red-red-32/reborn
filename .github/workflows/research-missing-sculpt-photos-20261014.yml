name: Audit missing sculpt image sources 2026-10-14
on:
  push:
    branches: [main]
    paths:
      - 'scripts/research_missing_sculpt_photos_20261014.py'
      - '.github/workflows/research-missing-sculpt-photos-20261014.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - name: Install HTML parser
        run: python3 -m pip install beautifulsoup4
      - name: Research named source pages with robots checks
        run: python3 scripts/research_missing_sculpt_photos_20261014.py
      - name: Archive isolated research evidence
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          cp photo-review-20261014.json /tmp/photo-review-20261014.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin scrape-results
          git checkout -B scrape-results origin/scrape-results
          mkdir -p snapshots/image-review
          cp /tmp/photo-review-20261014.json snapshots/image-review/photo-review-20261014.json
          git add snapshots/image-review/photo-review-20261014.json
          if ! git diff --cached --quiet; then
            git commit -m "Archive outstanding original sculpt image research $RUN_ID [skip ci]"
            for n in 1 2 3 4 5; do
              if git push origin HEAD:scrape-results; then exit 0; fi
              git fetch origin scrape-results
              git rebase origin/scrape-results || { git rebase --abort; exit 1; }
              sleep 2
            done
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: missing-sculpt-sources-20261014
          path: photo-review-20261014.json
          retention-days: 30
