name: Research Joanna and Ping exact photo sources
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/research-priority-photos.yml'
      - 'scripts/review_priority_images.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install image-source HTML parser
        run: python3 -m pip install beautifulsoup4
      - name: Research original named source pages
        run: |
          mkdir -p artifacts
          python3 scripts/review_priority_images.py --out artifacts/ping-joanna-photo-sources.json
      - name: Archive evidence on separate research branch
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          cp artifacts/ping-joanna-photo-sources.json /tmp/ping-joanna-photo-sources.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin scrape-results
          git checkout -B scrape-results origin/scrape-results
          mkdir -p snapshots/image-review
          cp /tmp/ping-joanna-photo-sources.json snapshots/image-review/ping-joanna-photo-sources.json
          git add snapshots/image-review/ping-joanna-photo-sources.json
          if ! git diff --cached --quiet; then
            git commit -m "Record Joanna and Ping named original kit photography $RUN_ID [skip ci]"
            for n in 1 2 3 4 5; do
              if git push origin HEAD:scrape-results; then exit 0; fi
              git fetch origin scrape-results
              git rebase origin/scrape-results || {git rebase --abort; exit 1;}
              sleep 2
            done
            exit 1
          fi
      - name: Keep evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exact-ping-joanna-photos
          path: artifacts/*.json
          retention-days: 30
