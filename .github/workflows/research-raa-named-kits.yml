name: Research photographed RAA sculptor kits
on:
  push:
    branches: [main]
    paths: ['scripts/research_raa_named_kits.py','.github/workflows/research-raa-named-kits.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - run: pip -q install beautifulsoup4
      - run: python3 scripts/research_raa_named_kits.py
      - name: Archive exact source-product photos
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          cp raa-extra-seven-kit-images.json /tmp/raa-extra-seven-kit-images.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin scrape-results
          git checkout -B scrape-results origin/scrape-results
          mkdir -p snapshots/raa
          cp /tmp/raa-extra-seven-kit-images.json snapshots/raa/named-original-kit-photography.json
          git add snapshots/raa/named-original-kit-photography.json
          if ! git diff --cached --quiet; then
            git commit -m "Archive exact-name RAA original kit photos $RUN_ID [skip ci]"
            for n in 1 2 3 4 5; do
              if git push origin HEAD:scrape-results; then exit 0; fi
              git fetch origin scrape-results
              git rebase origin/scrape-results || { git rebase --abort; exit 1; }
              sleep 2
            done
            exit 1
          fi
