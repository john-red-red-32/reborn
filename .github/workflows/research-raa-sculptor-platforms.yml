name: Research RAA sculptor site platforms and identity leads
on:
  push:
    branches: [main]
    paths:
      - 'scripts/research_raa_sculptor_platforms.py'
      - '.github/workflows/research-raa-sculptor-platforms.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sources:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: pip -q install beautifulsoup4
      - name: Enumerate exact RAA members, fetch public source profiles, recognise platforms
        run: python3 scripts/research_raa_sculptor_platforms.py
      - name: Preserve RAA classification on editorial research branch
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          cp raa-all-35-platforms-20261014.json /tmp/raa-all-35-platforms-20261014.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin scrape-results
          git checkout -B scrape-results origin/scrape-results
          mkdir -p snapshots/raa
          cp /tmp/raa-all-35-platforms-20261014.json snapshots/raa/all-35-platforms-20261014.json
          git add snapshots/raa
          if ! git diff --cached --quiet; then
            git commit -m "Archive RAA member identity and platform audit $RUN_ID [skip ci]"
            for n in 1 2 3 4 5 6; do
              if git push origin HEAD:scrape-results; then exit 0; fi
              git fetch origin scrape-results
              git rebase origin/scrape-results || { git rebase --abort; exit 1; }
              sleep 2
            done
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: raa-platform-audit
          path: raa-all-35-platforms-20261014.json
          retention-days: 45
