name: Smoke test Cloudflare-hosted Reborna
on:
  push:
    branches: [cloudflare-pages]
    paths:
      - '.github/workflows/smoke-cloudflare.yml'
      - 'functions/**'
      - 'next.config.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  remote:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Test public Cloudflare pages and APIs
        env:
          SITE: https://reborna-site.pages.dev
        run: |
          python3 - <<'PY'
          import json,os,time,urllib.request,urllib.error
          base=os.environ["SITE"].rstrip("/")
          opener=urllib.request.build_opener()
          opener.addheaders=[("User-Agent","Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/125.0 Safari/537.36"),("Accept","text/html,application/json;q=0.9,*/*;q=0.8")]
          urllib.request.install_opener(opener)
          try:
            with urllib.request.urlopen(base+"/",timeout=15) as response:
              print("Root response",response.status,response.headers.get("Content-Type"))
          except urllib.error.HTTPError as err:
            print("Root diagnostic",err.code,dict(err.headers),err.read(600).decode("utf-8","replace"))
            raise
          checks=[
            ("/","html"),
            ("/artists/nikki-johnston/","Nikki Johnston"),
            ("/artists/cassie-ann-love/","Cassie"),
            ("/kits/mabel-nikki-johnston/","Mabel"),
            ("/kits/christopher-nikki-johnston/","Christopher"),
          ]
          for path,expected in checks:
            last=""
            for attempt in range(3):
              try:
                with urllib.request.urlopen(base+path,timeout=15) as response:
                  html=response.read().decode("utf-8","replace")
                  assert response.status==200 and expected.lower() in html.lower(),f"Unexpected response or missing text at {path}"
                  print("OK",path,response.status,len(html));break
              except Exception as e:
                last=str(e)
                time.sleep(5)
            else:raise SystemExit(f"Failed {path}: {last}")
          for attempt in range(6):
            try:
              with urllib.request.urlopen(base+"/api/exchange-rates",timeout=15) as r:
                payload=json.load(r)
                assert r.status==200 and isinstance(payload.get("rates",{}).get("GBP"),(float,int))
                print("OK exchange rates",payload.get("date"));break
            except Exception as e:
              if attempt==5:raise
              time.sleep(5)
          try:
            urllib.request.urlopen(urllib.request.Request(base+"/api/admin/media",data=b"",method="POST"),timeout=15)
            raise AssertionError("Admin endpoint must deny unauthenticated uploads")
          except urllib.error.HTTPError as e:
            assert e.code==401,f"Admin endpoint gave unexpected status {e.code}"
            print("OK protected media API denies unauthenticated POST")
          PY
      - name: Verify custom domains serve the Cloudflare catalogue
        run: |
          python3 - <<'PY'
          import time,urllib.request,urllib.error
          opener=urllib.request.build_opener()
          opener.addheaders=[("User-Agent","Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/125.0 Safari/537.36")]
          urllib.request.install_opener(opener)
          for host in ["https://reborna.co","https://www.reborna.co"]:
            url=host+"/artists/nikki-johnston/"
            error=""
            for attempt in range(18):
              try:
                with urllib.request.urlopen(url,timeout=15) as response:
                  body=response.read().decode("utf-8","replace")
                  if response.status==200 and "Nikki Johnston" in body:
                    print("OK",host,response.status,"Nikki source verified",len(body));break
                  error=f"wrong response: {response.status} {len(body)}"
              except Exception as exc:
                error=str(exc)
              time.sleep(8)
            else:raise SystemExit(f"Custom domain not serving Nikki collection: {url}: {error}")
          PY
