name: Sync website to Cloudflare Pages
on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'components/**'
      - 'lib/**'
      - 'functions/api/community/**'
      - 'functions/api/contact.js'
      - 'functions/api/locale.js'
      - 'public/**'
      - 'package.json'
      - 'tsconfig.json'
      - '.github/workflows/sync-cloudflare.yml'

permissions:
  contents: write

concurrency:
  group: sync-reborna-cloudflare
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Synchronize reviewed website source, preserve Cloudflare hosting adapters
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main cloudflare-pages
          git checkout -B cloudflare-pages origin/cloudflare-pages
          git rm -r -f --ignore-unmatch app components lib public >/dev/null
          git checkout origin/main -- app components lib public package.json tsconfig.json
          mkdir -p functions/api/community
          git checkout origin/main -- functions/api/community functions/api/contact.js functions/api/locale.js
          git rm -f --ignore-unmatch app/api/exchange-rates/route.ts app/api/admin/media/route.ts
          git add -A app components lib public functions/api/community functions/api/contact.js functions/api/locale.js package.json tsconfig.json
          if ! git diff --cached --quiet; then
            git commit -m "Sync Reborna website updates from main to Cloudflare Pages"
            git push origin HEAD:cloudflare-pages
          else
            echo "No website source changes to sync."
          fi
