name: Verify community foundation
on:
  push:
    branches: [main, feature/wishlists-member-dashboard-20261014]
    paths:
      - 'app/**'
      - 'components/**'
      - 'lib/**'
      - 'functions/api/community/**'
      - 'functions/api/contact.js'
      - 'workers/community-moderation.js'
      - 'db/community-schema.sql'
      - 'db/community-moderation-v2.sql'
      - 'db/signup-diagnostics.sql'
      - 'db/member-profile-avatars.sql'
      - 'db/member-collections-and-drafts.sql'
      - 'db/member-saved-archive-extension.sql'
      - 'scripts/test-community-name-safety.mjs'
      - 'db/contact-enquiries.sql'
      - '.github/workflows/verify-community-foundation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate Pages Function syntax
        run: |
          node --check 'functions/api/community/[[path]].js'
          node --check functions/api/contact.js
          node --input-type=module --check < workers/community-moderation.js
      - name: Validate fresh schema and attributed editorial topics
        run: |
          python3 - <<'PY'
          import sqlite3
          from pathlib import Path
          d=sqlite3.connect(':memory:')
          d.execute('PRAGMA foreign_keys=ON')
          d.executescript(Path('db/community-schema.sql').read_text())
          assert d.execute("SELECT count(*) FROM posts").fetchone()[0] == 8
          assert d.execute("SELECT count(*) FROM users WHERE is_editorial=1").fetchone()[0] == 1
          assert d.execute("SELECT count(*) FROM votes").fetchone()[0] == 0
          assert d.execute("SELECT count(*) FROM replies").fetchone()[0] == 0
          d.executescript(Path('db/community-schema.sql').read_text())
          d.executescript(Path('db/community-moderation-v2.sql').read_text())
          d.executescript(Path('db/community-moderation-v2.sql').read_text())
          assert d.execute("SELECT count(*) FROM posts").fetchone()[0] == 8
          assert d.execute("SELECT count(*) FROM content_moderation").fetchone()[0] == 0
          d.execute("INSERT INTO content_moderation(content_type,content_id,state) VALUES ('post','guide-welcome','pending')")
          assert d.execute("SELECT count(*) FROM posts p WHERE NOT EXISTS(SELECT 1 FROM content_moderation m WHERE m.content_type='post' AND m.content_id=p.id AND m.state<>'approved')").fetchone()[0] == 7
          d.execute("UPDATE content_moderation SET state='approved' WHERE content_id='guide-welcome'")
          assert d.execute("SELECT count(*) FROM posts p WHERE NOT EXISTS(SELECT 1 FROM content_moderation m WHERE m.content_type='post' AND m.content_id=p.id AND m.state<>'approved')").fetchone()[0] == 8
          d.executescript(Path('db/contact-enquiries.sql').read_text())
          d.executescript(Path('db/contact-enquiries.sql').read_text())
          assert d.execute("SELECT count(*) FROM contact_enquiries").fetchone()[0] == 0
          d.executescript(Path('db/signup-diagnostics.sql').read_text())
          d.executescript(Path('db/signup-diagnostics.sql').read_text())
          assert d.execute("SELECT count(*) FROM signup_diagnostics").fetchone()[0]==0
          d.executescript(Path('db/member-profile-avatars.sql').read_text())
          d.executescript(Path('db/member-profile-avatars.sql').read_text())
          d.execute("INSERT INTO profile_avatars(user_id,mime_type,image_base64,version) VALUES('reborna-editorial','image/webp','UklGRg==',12)")
          assert d.execute("SELECT version FROM profile_avatars").fetchone()[0]==12
          d.execute("DELETE FROM profile_avatars WHERE user_id='reborna-editorial'")
          d.executescript(Path('db/member-collections-and-drafts.sql').read_text())
          d.executescript(Path('db/member-collections-and-drafts.sql').read_text())
          d.execute("INSERT INTO member_saved_items(user_id,item_type,item_path,item_title) VALUES('reborna-editorial','kit','/kits/example/','Example kit')")
          d.executescript(Path('db/member-saved-archive-extension.sql').read_text())
          assert d.execute("SELECT item_title FROM member_saved_items WHERE item_path='/kits/example/'").fetchone()[0]=='Example kit'
          d.execute("INSERT INTO member_saved_items(user_id,item_type,item_path,item_title) VALUES('reborna-editorial','archive','/artists/example/?sculpt=archive-rosie','Rosie')")
          d.execute("INSERT INTO member_studio_projects(id,user_id,title) VALUES('studio-ci','reborna-editorial','Test work')")
          d.execute("INSERT INTO member_listing_drafts(id,user_id,title,item_kind) VALUES('sale-ci','reborna-editorial','Test draft','finished_doll')")
          assert d.execute("SELECT count(*) FROM member_saved_items").fetchone()[0]==2
          assert d.execute("SELECT count(*) FROM member_studio_projects").fetchone()[0]==1
          assert d.execute("SELECT count(*) FROM member_listing_drafts").fetchone()[0]==1
          print('PASS D1 schemas: idempotent community, avatars, collection, studio and private seller drafts')
          PY
      - name: Verify Cloudflare password work-factor compatibility
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          source=Path('functions/api/community/[[path]].js').read_text()
          schema=Path('db/community-schema.sql').read_text()
          match=re.search(r'const ITERATIONS=(\d+);',source)
          assert match,'Missing canonical password work factor'
          cost=int(match.group(1))
          assert 10000<=cost<=100000, 'Cloudflare Workers PBKDF2 caps each deriveBits operation at 100,000 iterations'
          assert f'DEFAULT {cost}' in schema
          assert 'password_iterations,marketing_email' in source, 'New accounts must persist actual work factor'
          assert 'u?.password_iterations||ITERATIONS' in source, 'Login must use the account-specific work factor'
          assert 'password_iterations=?,updated_at=' in source, 'Password reset must persist updated work factor'
          print('PASS: password hashing work factor is supported on Cloudflare Workers and versioned in account records')
          PY
      - name: Prevent abusive aliases and innocent-name false positives
        run: node scripts/test-community-name-safety.mjs
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build and typecheck Next application
        env:
          NEXT_TELEMETRY_DISABLED: '1'
        run: npm run build
      - name: Verify Cloudflare static export
        env:
          NEXT_TELEMETRY_DISABLED: '1'
        run: |
          printf "/** @type {import('next').NextConfig} */\nconst config = {output:'export',trailingSlash:true,images:{unoptimized:true}};\nexport default config;\n" > next.config.mjs
          npm run build
          test -f out/community/index.html
          test -f out/account/index.html
          test -f out/dashboard/index.html
          test -f out/contact/index.html
          test -f out/messages/index.html
          test -f out/community/moderation/index.html
          test -f out/community/catalogue.json
          echo 'PASS static export of community and contact pages'
