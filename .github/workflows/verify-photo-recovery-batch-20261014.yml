name: Validate source-matched missing sculpt photographs
on:
  push:
    branches: [main]
    paths: ['.github/workflows/verify-photo-recovery-batch-20261014.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check HTTP image responses without making publication claims
        run: |
          python3 - <<'PY'
          import urllib.request,json
          data=[["river-awake-dawn-donofrio","https://mybabyflowers.com/wp-content/uploads/2026/09/DSC05693-scaled.jpg"],["tatum-dawn-donofrio","https://mybabyflowers.com/wp-content/uploads/2026/09/DSC06303-scaled.jpg"],["bibi-elly-knoops","https://cdn11.bigcommerce.com/s-80sd8ywaj3/products/3633/images/34162/bibi__82672.1587519263.500.750.jpg?c=2"],["fleur-elly-knoops","https://cdn11.bigcommerce.com/s-80sd8ywaj3/products/3919/images/37027/Fleur_CO_01__90454.1602698715.500.750.jpg?c=2"],["luca-elly-knoops","https://cdn11.bigcommerce.com/s-80sd8ywaj3/products/994/images/4134/luca3__35548.1483489613.500.750.jpg?c=2"],["candy-ping-lau","https://cdn11.bigcommerce.com/s-80sd8ywaj3/products/5294/images/66027/IMG_1483-XL__94758.1714701250.500.750.jpg?c=2"],["leo-sabine-altenkirch-junkes","https://cdn11.bigcommerce.com/s-80sd8ywaj3/products/2683/images/28171/67404500_2312742965655260_1659126027990859776_o__16368.1564684285.500.750.jpg?c=2"],["pebbles-severine-piret","https://cdn11.bigcommerce.com/s-80sd8ywaj3/products/5249/images/64935/425828430_10232255306469306_4146220900049131079_n__62135.1707582329.500.750.jpg?c=2"],["max-laura-lee-eagles","https://rebornsweetshop.com/cdn/shop/files/Max-by-Laura-Lee-Eagles-128-K_300x300.jpg?v=1726897302"],["max-laura-lee-eagles-LARGE","https://rebornsweetshop.com/cdn/shop/files/Max-by-Laura-Lee-Eagles-128-K_1024x1024.jpg?v=1726897302"],["timothy-sabrina-hergarten","https://www.truborns.com/cdn/shop/products/image_1b8176fb-f53f-4398-b0d3-3a7a8058022c_1024x.jpg?v=1615260085"],["talula-severine-piret","https://www.truborns.com/cdn/shop/files/IMG-4622_1024x.jpg?v=1698841829"],["dany-iveta-eckertova","https://www.puppen-traumland.de/media/image/53/7f/fe/98050439_3810665852337887_3435978045867950080_n_600x600.jpg"],["lou-severine-piret","https://static.wixstatic.com/media/0e4710_ff7e7a13718a4658a0dffe7646a95e03~mv2.jpg"],["mila-gudrun-legler","https://static.wixstatic.com/media/dcc6dd_3246b4f7b92341dd9e13f91a07e849d8~mv2.jpg"],["kitty-philomena-donnelly","https://static.wixstatic.com/media/e3ae82_58600f23bd554b9fb4353dc384a4fde7~mv2_d_1362_1833_s_2.jpg"],["minnie-ping-lau","https://www.oncesoreal.com/images/products/normal/Once-Reborn-Ping-Lau-Minnie_TOP.jpg"]]
          for slug,url in data:
           try:
            with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0','Accept':'image/*'}),timeout=18) as r:
             content=r.read(64)
             print('PASS' if r.status==200 and r.headers.get('Content-Type','').startswith('image/') and content else 'NOTIMAGE',slug,r.status,r.headers.get('Content-Type'),len(content),flush=True)
           except Exception as e:print('FAIL',slug,type(e).__name__,str(e)[:120],flush=True)
          
          PY
