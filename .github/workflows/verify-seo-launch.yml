name: Verify Reborna organic-search launch
on:
  push:
    branches: [main, feature/seo-launch-original-artists-20261014]
    paths:
      - 'app/**'
      - 'components/**'
      - 'lib/**'
      - 'tests/**'
      - 'functions/api/**'
      - 'db/**'
      - 'scripts/**'
      - 'tests/**'
      - 'functions/api/**'
      - 'db/**'
      - '.github/workflows/verify-seo-launch.yml'
  pull_request:
    branches: [main]
    paths:
      - 'app/**'
      - 'components/**'
      - 'lib/**'
      - 'scripts/**'
      - 'tests/**'
      - 'functions/api/**'
      - 'db/**'
      - '.github/workflows/verify-seo-launch.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck client and server code
        run: npm run lint
      - name: Check protected contact form endpoint regressions
        run: node --test tests/contact-handler.test.mjs tests/sculptor-request-handler.test.mjs tests/certificate-verification.test.mjs
      - name: Check fresh certificate registry D1 schema
        run: |
          python3 - <<'PY'
          import sqlite3
          from pathlib import Path
          d=sqlite3.connect(':memory:')
          d.execute('PRAGMA foreign_keys=ON')
          for path in ('db/community-schema.sql','db/community-moderation-v2.sql','db/contact-enquiries.sql','db/sculptor-intake-v1.sql','db/certificate-verification-v1.sql','db/certificate-email-approval-v2.sql'):
            d.executescript(Path(path).read_text())
          for table in ('verified_sculptor_issuers','certificate_batches','certificate_codes','certificate_lookup_events','certificate_audit','certificate_issue_approvals'):
            assert d.execute("SELECT name FROM sqlite_master WHERE type='table' AND name=?",(table,)).fetchone(),table
          columns=[x[1] for x in d.execute("PRAGMA table_info(certificate_codes)")]
          assert 'code_hash' in columns and 'code' not in columns
          challenge_columns=[x[1] for x in d.execute("PRAGMA table_info(certificate_issue_approvals)")]
          assert 'approval_hash' in challenge_columns and 'approval_code' not in challenge_columns
          assert 'expires_at' in challenge_columns and 'used_at' in challenge_columns
          d.execute("INSERT INTO users(id,email,handle,display_name,is_editorial,email_verified_at) VALUES('pilot-user',NULL,'pilot_user','Pilot User',1,datetime('now'))")
          d.execute("INSERT INTO sculptor_requests(id,member_id,kind,artist_name,state) VALUES('pilot-claim','pilot-user','claim_profile','Pilot Sculptor','closed')")
          d.execute("INSERT INTO verified_sculptor_issuers(user_id,artist_slug,artist_name,official_source_url,claim_request_id,authorised_by,authorisation_note) VALUES('pilot-user','pilot-sculptor','Pilot Sculptor','https://example.org/artist','pilot-claim','pilot-user','CI sample only')")
          d.execute("INSERT INTO certificate_batches(id,issuer_user_id,artist_slug,artist_name,sculpt_name,official_sculpt_url,quantity) VALUES('pilot-batch','pilot-user','pilot-sculptor','Pilot Sculptor','Sample Sculpt','https://example.org/sculpt',1)")
          d.execute("INSERT INTO certificate_codes(id,batch_id,code_hash,hint) VALUES('pilot-code','pilot-batch','sample-secure-hash','ABCD')")
          assert d.execute("SELECT code_hash FROM certificate_codes WHERE id='pilot-code'").fetchone()[0]=='sample-secure-hash'
          print('PASS: isolated D1 issuer, code, and lookup registry schema with no plaintext code column')
          PY
      - name: Build public site as static HTML for Cloudflare
        env:
          NEXT_TELEMETRY_DISABLED: '1'
        run: |
          printf "/** @type {import('next').NextConfig} */\nconst config = {output:'export',trailingSlash:true,images:{unoptimized:true}};\nexport default config;\n" > next.config.mjs
          npm run build
      - name: Verify real crawlable HTML, canonical metadata and crawler inventory
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          import xml.etree.ElementTree as ET
          from collections import Counter
          out=Path('out')
          class Page(HTMLParser):
            def __init__(self):
              super().__init__()
              self.in_title=False;self.in_h1=False
              self.title='';self.h1='';self.h1s=0;self.links=[];self.canonical='';self.robots='';self.images=[]
            def handle_starttag(self,tag,attrs):
              d=dict(attrs)
              if tag=='title':self.in_title=True
              if tag=='h1':self.in_h1=True;self.h1s+=1
              if tag=='a':self.links.append(d.get('href',''))
              if tag=='img':self.images.append(d.get('alt'))
              if tag=='link' and d.get('rel')=='canonical':self.canonical=d.get('href','')
              if tag=='meta' and d.get('name')=='robots':self.robots=d.get('content','')
            def handle_endtag(self,tag):
              if tag=='title':self.in_title=False
              if tag=='h1':self.in_h1=False
            def handle_data(self,data):
              if self.in_title:self.title+=data
              if self.in_h1:self.h1+=data
          def page(path):
            file=out/path.strip('/')/'index.html' if path!='/' else out/'index.html'
            assert file.is_file(),('missing static HTML',str(file))
            p=Page();p.feed(file.read_text());return p
          public=['/','/real-kits/','/artists/','/materials/','/events/','/community/','/privacy/','/terms/','/cookies/']
          for path in public:
            html=(out/path.strip('/')/'index.html' if path!='/' else out/'index.html').read_text()
            assert 'googletagmanager.com/gtag/js?id=G-PTENZWZFC1' not in html,(path,'GA4 must not load before consent')
            p=page(path)
            assert p.title and p.h1s==1,(path,'title/H1',p.title,p.h1s)
            assert 'noindex' not in p.robots.lower(),(path,'unexpected noindex',p.robots)
          verify=page('/verify/')
          assert verify.h1s==1 and 'noindex' not in verify.robots.lower()
          assert verify.canonical=='https://reborna.co/verify/'
          assert 'verify the original' in verify.h1.lower()
          assert '/verify/' in page('/').links or '/verify/' in page('/for-sculptors/').links
          history=page('/guides/cassie-ann-love-sculpt-history/')
          cassie=page('/artists/cassie-ann-love/')
          assert history.h1s==1 and len(history.title)>20
          assert history.canonical=='https://reborna.co/guides/cassie-ann-love-sculpt-history/'
          assert 'noindex' not in history.robots.lower()
          assert '/guides/cassie-ann-love-sculpt-history/' in cassie.links
          assert '/artists/cassie-ann-love/' in history.links
          for kind in ['artists','kits']:
            pages=list((out/kind).glob('*/index.html'))
            assert len(pages)>=5,(kind,'too few static pages',len(pages))
            sample=pages
            for file in sample:
              path='/'+str(file.relative_to(out).parent).replace('\\','/')+'/'
              p=page(path)
              assert p.h1s==1 and len(p.title)>20,(path,'title/H1',p.title,p.h1s)
              assert p.canonical=='https://reborna.co'+path,(path,'canonical',p.canonical)
              assert 'noindex' not in p.robots.lower(),(path,'noindex')
              assert '/kits/' in ' '.join(p.links) or kind=='kits',(path,'no source-visible sculpt links')
              assert all(x is not None for x in p.images),(path,'image missing alt')
            print(kind,len(pages),'static indexed profiles checked')
          material_dirs=list((out/'materials').glob('*/*/index.html'))
          assert material_dirs, 'no individual pre-rendered material product pages'
          for file in material_dirs:
            rel='/'+str(file.relative_to(out).parent).replace('\\','/')+'/'
            p=page(rel)
            assert p.h1s==1 and p.canonical=='https://reborna.co'+rel,(rel,p.h1s,p.canonical)
            assert 'noindex' not in p.robots.lower(),rel
          for path in ['/account/','/dashboard/','/messages/','/community/moderation/','/community/discussion/','/community/member/','/calendar/']:
            p=page(path)
            assert 'noindex' in p.robots.lower(),(path,'missing privacy/index guard')
          sitemap=out/'sitemap.xml';robots=out/'robots.txt';llms=out/'llms.txt'
          for f in [sitemap,robots,llms]:assert f.is_file(),('missing crawler file',str(f))
          root=ET.parse(sitemap).getroot()
          ns={'s':'http://www.sitemaps.org/schemas/sitemap/0.9'}
          urls=[x.text for x in root.findall('s:url/s:loc',ns)]
          assert len(urls)>100,('sitemap unexpectedly small',len(urls))
          assert len(set(urls))==len(urls),'duplicate sitemap URLs'
          assert all(x.startswith('https://reborna.co/') for x in urls)
          assert not any(x.endswith(('/account/','/dashboard/','/messages/','/calendar/')) for x in urls)
          rule=robots.read_text()
          assert 'Sitemap: https://reborna.co/sitemap.xml' in rule
          assert 'Disallow: /api/' in rule
          assert not any(line.strip()=='Disallow: /' for line in rule.splitlines())
          llm=llms.read_text()
          assert 'Reborna' in llm and 'https://reborna.co/artists/' in llm
          print('PASS',len(urls),'sitemap entries; static HTML and privacy-safe index boundaries')
          PY
      - name: Audit image sitemap discovery, credit sources and third-party photo hosts
        run: python3 scripts/audit-image-discovery.py out --probe
