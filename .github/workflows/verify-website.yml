name: Verify Reborna website
on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'components/**'
      - 'lib/**'
      - 'package.json'
      - 'tsconfig.json'
      - '.github/workflows/verify-website.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-reborna-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build Next.js and typecheck
        env:
          NEXT_TELEMETRY_DISABLED: '1'
        run: npm run build
